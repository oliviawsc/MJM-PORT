<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#166534">
    <title>Estate Info · Plantation Operation</title>
    <link rel="icon" type="image/png" href="../public/palm-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Same look as the Plantation Operation front page (../index.html) */
        :root { --ink: #0F172A; --mute: #64748B; --line: #E2E8F0; --brand: #166534; --soft: #F0FDF4; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: #F8FAFC; position: relative; overflow-x: hidden; }
        a { color: inherit; }
        .bg { position: fixed; inset: 0; z-index: -1; background: #F6F8FB; overflow: hidden; }
        .bg::before, .bg::after { content: ''; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
        .bg::before { width: 60vw; height: 60vw; left: -18vw; top: -22vw; background: #BBF7D0; }
        .bg::after { width: 55vw; height: 55vw; right: -20vw; bottom: -25vw; background: #BAE6FD; }
        .top { position: sticky; top: 0; z-index: 15; background: linear-gradient(90deg, rgba(224,242,254,.85), rgba(240,253,244,.85)); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(226,232,240,.8); }
        .top .in { max-width: none; margin: 0; height: 56px; padding: 0 16px 0 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
        .left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .back-slot { position: relative; height: 36px; flex: none; }
        .back { position: relative; display: inline-flex; align-items: center; height: 36px; padding: 0 9px; border-radius: 999px; border: 1px solid #CBD5E1; background: #fff;
                color: #334155; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; transition: background .15s; }
        .back svg { width: 18px; height: 18px; flex: none; }
        .back span { max-width: 0; opacity: 0; overflow: hidden; transition: max-width .2s ease, opacity .15s, margin .2s; }
        .back:hover, .back:focus-visible { background: #fff; box-shadow: 0 6px 18px rgba(15,23,42,.18); }
        .back:hover span, .back:focus-visible span { max-width: 200px; opacity: 1; margin-left: 6px; }
        .co-pick { position: relative; }
        .co-btn { height: 36px; padding: 0 30px 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; background: #fff; font: inherit; font-weight: 600; color: var(--ink); max-width: 40vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; position: relative; }
        .es-btn { padding-left: 30px; }
        .es-btn::before { content: ''; position: absolute; left: 11px; top: 10px; width: 9px; height: 9px; border: 2px solid #64748B; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
        .co-btn::after { content: ''; position: absolute; right: 11px; top: 13px; width: 7px; height: 7px; border-right: 2px solid #64748B; border-bottom: 2px solid #64748B; transform: rotate(45deg); }
        .co-menu { display: none; position: absolute; left: 0; top: 42px; min-width: 100%; width: max-content; max-width: 70vw; max-height: 60vh; overflow: auto; background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 16px 40px rgba(15,23,42,.16); padding: 6px; z-index: 40; }
        .co-menu.open { display: block; }
        .co-menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; white-space: nowrap; }
        .co-menu button:hover { background: #F1F5F9; }
        .co-menu button.on { font-weight: 700; color: #14532D; }
        .co-menu button.on::before { content: '\2713'; color: #16A34A; }
        .co-menu button:not(.on)::before { content: ''; width: 12px; }
        .switch { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(248,250,252,.92); backdrop-filter: blur(6px); font-weight: 600; color: #14532D; }
        .switch .spin { width: 28px; height: 28px; border: 3px solid #BBF7D0; border-top-color: #166534; border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto 10px; }
        @keyframes s { to { transform: rotate(360deg); } }
        .title { font-weight: 700; font-size: 18px; letter-spacing: -.01em; text-align: center; white-space: nowrap; }
        .who { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
        .who .me { text-align: right; line-height: 1.25; min-width: 0; }
        .who .me b { display: block; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .who .me small { display: block; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .who .avatar { width: 32px; height: 32px; border-radius: 50%; background: #E2E8F0; display: grid; place-items: center; font-size: 14px; font-weight: 600; flex: none; overflow: hidden; }
        .who .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .who .logout { width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; color: #64748B; display: grid; place-items: center; cursor: pointer; }
        .who .logout:hover { background: rgba(241,245,249,.9); color: #0F172A; }
        .who .logout svg { width: 20px; height: 20px; }

        main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
        .ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
        .pick { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--mute); }
        .pick select, .input, .btn, .dlg select { height: 36px; border-radius: 10px; border: 1px solid #CBD5E1; background: #fff; font: inherit; font-size: 14px; color: var(--ink); }
        .pick select, .dlg select { padding: 0 10px; font-weight: 600; max-width: 70vw; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: #fff; border: 1px solid #CBD5E1; font-size: 12.5px; font-weight: 600; color: #334155; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
        .card { background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
        .card .k { font-size: 12px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
        .card .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
        .card .v small { font-size: 12px; color: var(--mute); font-weight: 600; margin-left: 3px; }
        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
        .bar .sp { flex: 1; }
        .btn { padding: 0 14px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #F1F5F9; }
        .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
        .btn.primary:hover { background: #14532D; }
        .btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; border-radius: 8px; }
        .btn.danger { color: #B91C1C; }
        .btn:disabled { opacity: .5; cursor: default; }
        .input { padding: 0 10px; }
        .wrap { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
        th { background: #F8FAFC; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--mute); position: sticky; top: 0; }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
        td.wrapcell { white-space: normal; min-width: 160px; }
        td.grp { font-weight: 700; background: #FAFAF9; border-right: 1px solid var(--line); }
        tr.sub td { background: var(--soft); font-weight: 600; color: #14532D; }
        tr.total td { background: #ECFDF5; font-weight: 700; border-top: 2px solid #A7F3D0; }
        td .acts { display: flex; gap: 6px; }
        .muted { color: var(--mute); }
        .note { padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 14px; }
        .note.warn { background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; }
        .note.err { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; }
        .note.info { background: #F0F9FF; border: 1px solid #BAE6FD; color: #075985; }
        .empty { padding: 40px 20px; text-align: center; color: var(--mute); }
        .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; place-items: center; z-index: 20; padding: 16px; }
        .modal.open { display: grid; }
        .dlg { width: 100%; max-width: 560px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 92vh; overflow: auto; }
        .dlg.wide { max-width: 760px; }
        .dlg h2 { margin: 0 0 12px; font-size: 18px; }
        .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
        .form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--mute); }
        .form label.full { grid-column: 1 / -1; }
        .form label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }
        .form input, .form textarea, .form select { height: 36px; border-radius: 10px; border: 1px solid #CBD5E1; padding: 0 10px; font: inherit; font-size: 14px; color: var(--ink); background: #fff; }
        .form input[type=checkbox] { height: 18px; width: 18px; }
        .form textarea { height: 160px; padding: 8px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; white-space: pre; }
        .form textarea.plain { height: 70px; font-family: inherit; font-size: 14px; white-space: normal; }
        .dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .hint { font-size: 12.5px; color: var(--mute); margin: 6px 0 0; }
        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0F172A; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; display: none; z-index: 30; }
        /* Editable block grid (one page, type straight into the cells) */
        .sec { margin-top: 26px; }
        .sec > h2 { font-size: 17px; margin: 0 0 10px; }
        .meta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 0 0 12px; font-size: 13px; color: var(--mute); }
        .meta label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
        .meta input[type=date] { height: 32px; border: 1px solid #CBD5E1; border-radius: 8px; padding: 0 8px; font: inherit; font-size: 13px; color: var(--ink); background: #fff; }
        table.grid { table-layout: fixed; width: 100%; font-size: 13px; }
        table.grid td { padding: 3px 3px; text-align: center; vertical-align: middle; }
        table.grid td.calc, table.grid td.num { text-align: center; padding-right: 3px; }
        table.grid input { text-align: center; }
        table.grid th.pm { font-size: 20px; font-weight: 700; line-height: 1; }
        table.grid tr.sub td, table.grid tr.total td { text-align: center; }
        table.grid tr.sub td:first-child, table.grid tr.total td:first-child { text-align: right; padding-right: 14px; }
        table.grid:not(.editing) tbody tr:not(.sub):not(.total) td { padding-top: 7px; padding-bottom: 7px; }
        table.grid small { font-size: 11px; font-weight: 500; color: var(--mute); }
        .wrap { overflow: visible; }
        table.grid td.lvl { background: #FAFAF9; vertical-align: middle; font-weight: 600; }
        table.grid input { width: 100%; min-width: 0; height: 32px; border: 1px solid #CBD5E1; border-radius: 7px; padding: 0 6px; font: inherit; font-size: 13px; color: var(--ink); background: #fff; }
        table.grid input.num { font-variant-numeric: tabular-nums; }
        table.grid th { padding-left: 6px; padding-right: 6px; white-space: normal; font-size: 11px; }
        table.grid td.hd { text-align: center; padding: 0; }
        .handle { display: inline-block; cursor: grab; color: #94A3B8; font-size: 14px; letter-spacing: -3px; user-select: none; padding: 6px 4px; }
        .handle:hover { color: var(--ink); }
        tr.ghost-src td { opacity: .35; }
        .drag-ghost { position: fixed; z-index: 30; pointer-events: none; display: table; background: #fff; box-shadow: 0 12px 30px rgba(15,23,42,.25); border-radius: 10px; opacity: .95; }
        body.dragging { cursor: grabbing; user-select: none; }
        table.grid input:hover { border-color: #E2E8F0; background: #fff; }
        table.grid input:focus { outline: none; border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px rgba(22,101,52,.12); }
        table.grid input.dirty { background: #FEFCE8; }
        table.grid input.saved { background: #ECFDF5; transition: background 1.2s; }
        table.grid input.bad { border-color: #FCA5A5; background: #FEF2F2; }
        table.grid td.calc { color: var(--ink); font-variant-numeric: tabular-nums; }
        table.grid.editing td.calc { color: var(--mute); }
        table.grid tr.new td { background: #F0FDF4; }
        table.grid .x { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #94A3B8; cursor: pointer; font-size: 16px; }
        table.grid .x:hover { background: #FEF2F2; color: #B91C1C; }
        .legend { font-size: 12px; color: var(--mute); margin: 8px 0 0; }
        table.grid thead th { text-align: center; vertical-align: middle; }
        table.grid thead th.grp-h { background: #ECFDF5; color: #14532D; border-bottom: 1px solid #D1FAE5; }
        table.grid thead button.hdate { height: 26px; border: 1px dashed #CBD5E1; border-radius: 8px; background: #fff; font: inherit; font-size: 11px; font-weight: 700; color: var(--ink); padding: 0 6px; cursor: pointer; white-space: nowrap; }
        table.grid thead button.hdate:hover { border-color: var(--brand); }
        table.grid thead input.hdate-in { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        table.grid input.faint, table.grid td.faint { color: #CBD5E1; }
        table.grid input.faint:focus { color: var(--ink); }

        /* Settings */
        .tlist { display: grid; gap: 10px; }
        .titem { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
        .titem .nm { font-weight: 700; }
        .titem .ds { font-size: 12.5px; color: var(--mute); margin-top: 2px; }
        .titem .sp { flex: 1; }
        .cols { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 6px; }
        .colrow { display: grid; grid-template-columns: 1fr 130px 1.1fr auto auto; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
        .colrow:first-child { border-top: 0; }
        .colrow input, .colrow select { height: 34px; border-radius: 9px; border: 1px solid #CBD5E1; padding: 0 8px; font: inherit; font-size: 13.5px; min-width: 0; background: #fff; }
        .colrow .req { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--mute); white-space: nowrap; }
        .colrow .mv { display: flex; gap: 4px; }
        .colhead { display: grid; grid-template-columns: 1fr 130px 1.1fr auto auto; gap: 8px; padding: 8px 10px; background: #F8FAFC; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--mute); }
        @media (max-width: 640px) {
            .who .me { display: none; } .top .in { grid-template-columns: auto 1fr auto; } .title { font-size: 16px; }
            .form { grid-template-columns: 1fr; } .colrow, .colhead { grid-template-columns: 1fr 1fr; } .colhead span:nth-child(n+3) { display: none; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="switch" id="switch"><div><div class="spin"></div><div id="switchText">Switching company…</div></div></div>
    <header class="top"><div class="in">
        <div class="left">
            <span class="back-slot"><a class="back" id="back" href="../" title="Back to Plantation Operation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span>Back to Plantation Operation</span></a></span>
            <div class="co-pick" id="coPick" style="display:none;"><button type="button" class="co-btn" id="coBtn" aria-haspopup="listbox"></button><div class="co-menu" id="coMenu" role="listbox"></div></div>
            <div class="co-pick" id="esPick" style="display:none;"><button type="button" class="co-btn es-btn" id="esBtn" aria-haspopup="listbox" title="Location"></button><div class="co-menu" id="esMenu" role="listbox"></div></div>
        </div>
        <div class="title">Estate Info</div>
        <div class="who" id="who"></div>
    </div></header>

    <main>
        <div id="note"></div>
        <div class="ctx" id="ctx"></div>
        <section id="blocksSec"></section>
    </main>

    <!-- Blocks: add / edit one block -->


    <div class="toast" id="toast"></div>

<script>
(function () {
    const SUPABASE_URL = 'https://pxzvayptwpvuvlenmdwp.supabase.co';
    const KEY = 'sb_publishable_tKap42sXnzGzmVUoLAw4xQ__bkXq8l_';
    const SESSION_KEY = 'opp_auth_session';
    const LOGOUT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>';
    // Log out of Plantation Operation and go back to the Intranet
    function logout() {
        localStorage.removeItem(SESSION_KEY);
        try { Object.keys(localStorage).filter((k) => /^sb-.*-auth-token$/.test(k)).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
        location.href = 'https://mjmelon.github.io/MJM-Intranet/?gw_logout=1'; // the Intranet signs out too
    }
    const COMPANY_ID_KEY = 'port_company_id';   // shared with the front page
    const COMPANY_KEY = 'port_company';         // company name, shared with the front page
    const ESTATE_KEY = 'port_location'; // same key as the front page: the location follows across pages
    const H = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const num = (v, d) => (v == null || v === '' || isNaN(+v)) ? '—' : (+v).toLocaleString('en-MY', { minimumFractionDigits: d, maximumFractionDigits: d });
    const $ = (id) => document.getElementById(id);
    const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, 2600); };

    // ---- Who is here (MJM Intranet sign-in only)
    let session = null;
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch (e) {}
    if (session && session.via !== 'intranet') session = null;
    const perms = () => (session && session.permissions && !Array.isArray(session.permissions) ? session.permissions : {});
    // Edit records: Super Admin, or Estate Info = Edit in PORT → User Access
    // (an Admin whose access was never set keeps the Admin edit right)
    const canEdit = () => {
        if (!session) return false;
        if (session.role === 'superadmin') return true;
        const p = perms();
        if (p.__configured) return p.estateinfo === 'edit';
        return session.role === 'admin';
    };
    // Settings (designing tables): Super Admin and Admins
    const canSet = () => !!session && (session.role === 'superadmin' || session.role === 'admin');

    // ---- Companies: exactly the ones MJM Intranet gave this person (session, Intranet code order)
    const companies = session && Array.isArray(session.companies) ? session.companies.filter((c) => c && typeof c === 'object' && c.id && c.name) : [];
    const params = new URLSearchParams(location.search);
    const findCompany = (v) => {
        const x = String(v || '').trim().toLowerCase();
        if (!x) return null;
        return companies.find((c) => c.id === v) || companies.find((c) => [c.code, c.short_name, c.name].some((k) => (k || '').toLowerCase() === x)) || null;
    };
    const ctxEstate = (params.get('gw_estate') || '').trim();
    let company = findCompany(params.get('gw_company_id')) || findCompany(params.get('gw_company')) || findCompany(params.get('gw_company_name'));
    (function cleanUrl() { try { const u = new URL(location.href); ['gw_token', 'gw_company_id', 'gw_company', 'gw_company_name', 'gw_company_short', 'gw_estate', 'gw_estate_short'].forEach((k) => u.searchParams.delete(k)); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) {} })();
    if (!company) { try { company = findCompany(localStorage.getItem(COMPANY_ID_KEY)) || findCompany(localStorage.getItem(COMPANY_KEY)); } catch (e) {} }
    if (!company && companies.length === 1) company = companies[0];

    let estates = [], estate = '', rows = [], meta = {};

    async function api(path, opt) {
        const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({ headers: H }, opt || {}));
        if (!res.ok) { let m = 'HTTP ' + res.status; try { const j = await res.json(); m = j.message || j.hint || m; } catch (e) {} throw new Error(m); }
        return res.status === 204 ? null : res.json();
    }
    const note = (html, kind) => { $('note').innerHTML = html ? '<p class="note ' + (kind || 'warn') + '">' + html + '</p>' : ''; };

    // ---- Top bar (same as the front page)
    function drawTop() {
        const name = session ? (session.name || session.email || '') : '';
        const photo = session && session.avatar && /^https:\/\/[a-z0-9]+\.supabase\.co\/storage\/v1\/object\/public\//.test(session.avatar) ? session.avatar : '';
        $('who').innerHTML = session ? '<div class="me"><b>' + esc(name) + '</b><small>' + esc(session.email || '') + '</small></div><span class="avatar">' +
            (photo ? '<img src="' + esc(photo) + '" alt="">' : esc(name.trim().slice(0, 1).toUpperCase() || '?')) + '</span>' +
            '<button type="button" class="logout" id="logout" title="Log out" aria-label="Log out">' + LOGOUT_SVG + '</button>' : '';
        if (session) $('logout').onclick = logout;
        const pick = $('coPick');
        if (companies.length) {
            pick.style.display = '';
            $('coBtn').textContent = company ? company.name : '— Choose company —';
            $('coMenu').innerHTML = companies.map((c) => '<button type="button" data-co="' + esc(c.id) + '" class="' + (company && c.id === company.id ? 'on' : '') + '">' + esc(c.name) + '</button>').join('');
        } else pick.style.display = 'none';
        const u = new URL('../', location.href);
        if (company) u.searchParams.set('gw_company_id', company.id);
        $('back').href = u.pathname + u.search;
    }
    $('coBtn').onclick = () => $('coMenu').classList.toggle('open');
    document.addEventListener('click', (e) => { if (!e.target.closest('#coPick')) $('coMenu').classList.remove('open'); });
    $('coMenu').onclick = (e) => {
        const b = e.target.closest('[data-co]'); if (!b) return;
        $('coMenu').classList.remove('open');
        const c = findCompany(b.dataset.co); if (!c || (company && c.id === company.id)) return;
        // Switching a company reloads the page for that company
        $('switchText').textContent = 'Switching to ' + c.name + '…'; $('switch').style.display = 'grid';
        try { localStorage.setItem(COMPANY_ID_KEY, c.id); localStorage.setItem(COMPANY_KEY, c.name); } catch (e2) {}
        setTimeout(() => { location.href = location.pathname + '?gw_company_id=' + encodeURIComponent(c.id); }, 350);
    };

    // ---- Locations (old estate names) of the chosen company
    async function loadEstates() {
        estates = [];
        if (!company) return;
        // the company's locations, exactly as set in the Intranet (given at sign-in); none → the company itself
        if (session && session.company_estates && Array.isArray(session.company_estates[company.id])) estates = session.company_estates[company.id].filter(Boolean);
        if (!estates.length) estates = [company.name];
        let want = ctxEstate; try { want = want || localStorage.getItem(ESTATE_KEY + ':' + company.id) || ''; } catch (e) {}
        estate = estates.includes(want) ? want : estates[0];
    }
    async function setCompany(c) {
        company = c || null;
        try { if (company) { localStorage.setItem(COMPANY_ID_KEY, company.id); localStorage.setItem(COMPANY_KEY, company.name); } } catch (e) {}
        drawTop();
        await loadEstates();
        load();
    }
    function setEstate(e) {
        estate = e || '';
        try { if (company && estate) localStorage.setItem(ESTATE_KEY + ':' + company.id, estate); } catch (e2) {}
        load();
    }

    // ---- Load and draw the one table of this page
    async function load() {
        if (!session) { $('ctx').innerHTML = ''; $('blocksSec').innerHTML = ''; return note('You are not signed in. Please open Plantation Operation from <a href="https://mjmelon.github.io/MJM-Intranet/">MJM Intranet</a>.'); }
        if (!companies.length) { $('ctx').innerHTML = ''; $('blocksSec').innerHTML = ''; return note('&#9888;&#65039; No company has been given to you for this module in MJM Intranet.'); }
        if (!company) { $('ctx').innerHTML = ''; $('blocksSec').innerHTML = ''; return note('Choose a company in the top bar.'); }
        note('');
        drawCtx();
        rows = []; meta = {};
        try { rows = await api('port_estate_blocks?select=*&estate=eq.' + encodeURIComponent(estate) + '&order=sort_order.asc,id.asc'); }
        catch (e) { note('Could not load blocks: ' + esc(e.message) + (/port_estate_blocks/.test(e.message) ? '. The table has not been created yet (run docs/run-after-setup.sql in Supabase).' : ''), 'err'); }
        try { const m = await api('port_estate_meta?select=*&estate=eq.' + encodeURIComponent(estate)); meta = m[0] || {}; } catch (e) { meta = {}; }
        drawBlocks();
    }
    function drawCtx() { // Location dropdown in the top bar, beside the company
        $('ctx').innerHTML = '';
        const show = !!(session && session.company_estates && (session.company_estates[company.id] || []).length); // only when the Intranet lists locations
        $('esPick').style.display = show ? '' : 'none';
        if (!show) return;
        $('esBtn').textContent = estate || '— Location —';
        $('esMenu').innerHTML = estates.map((n) => '<button type="button" data-es="' + esc(n) + '" class="' + (n === estate ? 'on' : '') + '">' + esc(n) + '</button>').join('');
    }
    $('esBtn').onclick = () => $('esMenu').classList.toggle('open');
    document.addEventListener('click', (e) => { if (!e.target.closest('#esPick')) $('esMenu').classList.remove('open'); });
    $('esMenu').onclick = (e) => {
        const b = e.target.closest('[data-es]'); if (!b) return;
        $('esMenu').classList.remove('open');
        if (b.dataset.es !== estate) { if (editing && !confirm('Discard the changes?')) return; editing = false; draft = []; removed = []; setEstate(b.dataset.es); }
    };

    // =====================================================================
    // The block table: Division | Phase | Block | Year planted | Area (before, after) |
    // Palm count (before, after, ±) | Density (before, after, ±)
    // "before" and "after" are two map dates, set in the column titles.
    // View mode shows the figures; Edit turns the cells into boxes, with
    // Cancel / Save. Nothing is written until Save.
    // =====================================================================
    const sum = (list, k) => list.reduce((a, r) => a + (r[k] == null || r[k] === '' ? 0 : +r[k]), 0);
    const densOf = (area, palms) => (area > 0 && palms != null && palms !== '' ? palms / area : null);
    const avgDens = (list, ak, pk) => { const a = sum(list, ak), p = sum(list, pk); return a > 0 && p ? p / a : null; };
    const diff = (a, b, d) => (a == null || b == null ? '' : (b - a < 0 ? '−' + num(a - b, d) : b - a > 0 ? '+' + num(b - a, d) : '0'));
    const FIELDS = [
        { k: 'division',        type: 'text', lvl: true },
        { k: 'phase',           type: 'text', lvl: true },
        { k: 'block',           type: 'text' },
        { k: 'year_planted',    type: 'text' },
        { k: 'area_ha_prev',    type: 'dec' },
        { k: 'area_ha',         type: 'dec' },
        { k: 'palm_count_prev', type: 'int' },
        { k: 'palm_count',      type: 'int' },
    ];
    const sortRows = () => rows.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0) || (a.id || 0) - (b.id || 0));
    const monthLabel = (d) => { if (!d) return ''; const x = new Date(d + (d.length === 7 ? '-01' : '')); return isNaN(x) ? d : x.toLocaleDateString('en-MY', { month: 'short', year: 'numeric' }); };
    let editing = false, draft = [], removed = [];

    function drawBlocks() {
        const edit = editing && canEdit();
        const list = edit ? draft : rows;
        const before = monthLabel(meta.prev_map_date) || 'Before', after = monthLabel(meta.map_date) || 'After';
        const dateCell = (k, label) => canEdit()
            ? '<th class="num"><button type="button" class="hdate" data-meta="' + k + '" title="Map date: click to change">' + esc(label) + ' &#9662;</button><input type="month" class="hdate-in" data-meta="' + k + '" value="' + esc((meta[k] || '').slice(0, 7)) + '"></th>'
            : '<th class="num">' + esc(label) + '</th>';
        const head =
            '<colgroup>' + (edit ? '<col style="width:4%">' : '') + '<col style="width:9%"><col style="width:7%"><col style="width:8%"><col style="width:8%">' +
            '<col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:5%"><col style="width:9%"><col style="width:9%"><col style="width:5%">' + (edit ? '<col style="width:4%">' : '') + '</colgroup><thead>' +
            '<tr>' + (edit ? '<th rowspan="2"></th>' : '') + '<th rowspan="2">Division</th><th rowspan="2">Phase</th><th rowspan="2">Block</th><th rowspan="2">Year planted</th>' +
            '<th colspan="2" class="grp-h">Area (ha)</th><th colspan="3" class="grp-h">Palm count</th><th colspan="3" class="grp-h">Density (palms/ha)</th>' + (edit ? '<th rowspan="2"></th>' : '') + '</tr>' +
            '<tr>' + dateCell('prev_map_date', before) + dateCell('map_date', after) +
            dateCell('prev_map_date', before) + dateCell('map_date', after) + '<th class="pm">&plusmn;</th>' +
            '<th class="num">' + esc(before) + '</th><th class="num">' + esc(after) + '</th><th class="pm">&plusmn;</th></tr></thead>';
        const groups = [];
        list.forEach((r) => { const key = (r.division || '') + '\u0001' + (r.phase || ''); const g = groups[groups.length - 1]; if (g && g.key === key) g.rows.push(r); else groups.push({ key, rows: [r] }); });
        let body = '';
        // View mode: one merged Division cell per run of rows with the same division
        // (it also spans the phase subtotal rows inside the run), one merged Phase cell per group.
        const divRuns = [];
        groups.forEach((g) => { const d = g.rows[0].division || ''; const run = divRuns[divRuns.length - 1]; if (run && run.d === d) run.groups.push(g); else divRuns.push({ d, groups: [g] }); });
        divRuns.forEach((run) => {
            let first = true;
            const span = run.groups.reduce((n, g) => n + g.rows.length + (g.rows.length > 1 ? 1 : 0), 0);
            run.groups.forEach((g) => {
                g.rows.forEach((r, i) => {
                    body += rowHtml(r, edit, i > 0, edit ? null : { div: first ? span : 0, phase: i === 0 ? g.rows.length : 0 });
                    first = false;
                });
                if (g.rows.length > 1) body += totalRow(g.rows[0].phase ? 'Phase ' + g.rows[0].phase : 'Subtotal', g.rows, 'sub', edit, !edit);
            });
        });
        if (list.length) body += totalRow('Total', list, 'total', edit);
        const empty = !list.length ? '<div class="empty" id="gridEmpty">No blocks recorded for ' + esc(estate) + ' yet.' + (canEdit() && !edit ? '<br>Press <b>Edit</b> to start.' : '') + '</div>' : '';
        const bar = !canEdit() ? '' : edit
            ? '<div class="bar"><button class="btn sm" id="addBtn">+ Add row</button><span class="sp"></span><button class="btn sm" id="cancelBtn">Cancel</button><button class="btn sm primary" id="saveBtn">Save</button></div>'
            : '<div class="bar"><span class="sp"></span><button class="btn sm primary" id="editBtn">Edit</button></div>';
        $('blocksSec').innerHTML = bar + '<div class="wrap"><table class="grid' + (edit ? ' editing' : '') + '"' + (list.length ? '' : ' style="display:none"') + '>' + head + '<tbody id="gridBody">' + body + '</tbody></table>' + empty + '</div>';
        if (!canEdit()) return;
        $('blocksSec').querySelectorAll('button.hdate').forEach((b) => { b.onclick = () => { const inp = b.nextElementSibling; try { inp.showPicker(); } catch (e) { inp.style.position = 'static'; inp.focus(); } }; });
        $('blocksSec').querySelectorAll('input.hdate-in').forEach((inp) => { inp.onchange = () => saveMeta(inp.dataset.meta, inp.value); });
        if (!edit) { $('editBtn').onclick = startEdit; return; }
        $('addBtn').onclick = addRow;
        $('cancelBtn').onclick = () => { if (!isDirty() || confirm('Discard the changes?')) { editing = false; draft = []; removed = []; drawBlocks(); } };
        $('saveBtn').onclick = saveAll;
        const gb = $('gridBody');
        gb.addEventListener('input', (e) => { const inp = e.target.closest('input[data-k]'); if (!inp) return; const tr = inp.closest('tr'); Object.assign(rowOf(tr), readRow(tr)); liveCalc(tr); });
        gb.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const inp = e.target.closest('input[data-k]'); if (!inp) return;
            e.preventDefault();
            const tr = inp.closest('tr'), inputs = [...tr.querySelectorAll('input[data-k]')], n = inputs[inputs.indexOf(inp) + 1];
            if (n) n.focus(); else addRow();
        });
        gb.addEventListener('click', (e) => { const b = e.target.closest('[data-del]'); if (b) delRow(b.closest('tr')); });
        gb.addEventListener('focusin', (e) => { if (e.target.matches && e.target.matches('input[data-k]')) e.target.select(); }); // typing replaces, like a spreadsheet
        enableRowDrag(gb);
    }
    function calc(r) {
        const d0 = densOf(r.area_ha_prev, r.palm_count_prev), d1 = densOf(r.area_ha, r.palm_count);
        return { pd: diff(r.palm_count_prev, r.palm_count, 0), d0, d1, dd: diff(d0, d1, 0) };
    }
    function rowHtml(r, edit, repeat, merge) {
        const c = calc(r);
        const cell = (f) => {
            const v = r[f.k] == null ? '' : r[f.k];
            const same = repeat && f.lvl; // same division / phase as the row above: shown faint
            if (!edit && f.lvl && merge) { // merged cell: once per run, "-" when empty
                const span = f.k === 'division' ? merge.div : merge.phase;
                return span ? '<td class="lvl" rowspan="' + span + '">' + (esc(v) || '-') + '</td>' : '';
            }
            if (!edit) return '<td class="' + (f.type !== 'text' ? 'calc' : f.lvl ? 'lvl' : '') + (same ? ' faint' : '') + '">' + (f.type === 'dec' ? num(v, 2) : f.type === 'int' ? (v === '' ? '—' : num(v, 0)) : (esc(v) || (f.lvl ? '' : '—'))) + '</td>';
            return '<td' + (f.lvl ? ' class="lvl"' : '') + '><input data-k="' + f.k + '" class="' + (f.type !== 'text' ? 'num' : '') + (same ? ' faint' : '') + '" value="' + esc(v) + '"' +
                (f.type === 'dec' ? ' inputmode="decimal"' : f.type === 'int' ? ' inputmode="numeric"' : '') + '></td>';
        };
        return '<tr data-key="' + esc(r._key) + '"' + (r.id ? '' : ' class="new"') + '>' + (edit ? '<td class="hd"><span class="handle" title="Drag to move">&#8942;&#8942;</span></td>' : '') + FIELDS.map(cell).join('') +
            '<td class="calc" data-c="pd">' + c.pd + '</td><td class="calc" data-c="d0">' + num(c.d0, 0) + '</td><td class="calc" data-c="d1">' + num(c.d1, 0) + '</td><td class="calc" data-c="dd">' + c.dd + '</td>' +
            (edit ? '<td><button class="x" data-del title="Delete row">&times;</button></td>' : '') + '</tr>';
    }
    function totalRow(label, list, cls, edit, underDivision) {
        const d0 = avgDens(list, 'area_ha_prev', 'palm_count_prev'), d1 = avgDens(list, 'area_ha', 'palm_count');
        const ha = (v) => num(v, 2) + ' <small>ha</small>', ph = (v) => (v == null ? '—' : num(v, 0) + ' <small>palms/ha</small>');
        return '<tr class="' + cls + '"><td colspan="' + (edit ? 5 : underDivision ? 3 : 4) + '">' + esc(label) + '</td>' +
            '<td class="num">' + ha(sum(list, 'area_ha_prev')) + '</td><td class="num">' + ha(sum(list, 'area_ha')) + '</td>' +
            '<td class="num">' + num(sum(list, 'palm_count_prev'), 0) + '</td><td class="num">' + num(sum(list, 'palm_count'), 0) + '</td><td class="num">' + diff(sum(list, 'palm_count_prev'), sum(list, 'palm_count'), 0) + '</td>' +
            '<td class="num">' + ph(d0) + '</td><td class="num">' + ph(d1) + '</td><td class="num">' + diff(d0, d1, 0) + '</td>' + (edit ? '<td></td>' : '') + '</tr>';
    }
    const rowOf = (tr) => draft.find((r) => r._key === tr.dataset.key);
    function readRow(tr) {
        const o = {};
        tr.querySelectorAll('input[data-k]').forEach((inp) => {
            const f = FIELDS.find((x) => x.k === inp.dataset.k), v = inp.value.trim();
            o[f.k] = f.type === 'text' ? v : (v === '' ? null : +v.replace(/,/g, ''));
        });
        return o;
    }
    function liveCalc(tr) {
        const c = calc(readRow(tr));
        const set = (k, v) => { const td = tr.querySelector('[data-c="' + k + '"]'); if (td) td.textContent = v; };
        set('pd', c.pd); set('d0', num(c.d0, 0)); set('d1', num(c.d1, 0)); set('dd', c.dd);
    }
    let keyN = 0;
    const withKey = (r) => Object.assign({}, r, { _key: 'k' + (++keyN), _orig: JSON.stringify(r) });
    function startEdit() {
        editing = true; removed = [];
        draft = rows.map(withKey);
        drawBlocks();
        const first = $('gridBody').querySelector('input[data-k]'); if (first) first.focus();
    }
    const changed = (r) => JSON.stringify(Object.assign({}, r, { _key: undefined, _orig: undefined, sort_order: undefined })) !== JSON.stringify(Object.assign({}, JSON.parse(r._orig), { _key: undefined, _orig: undefined, sort_order: undefined }));
    const isDirty = () => removed.length > 0 || draft.some((r) => !r.id || changed(r));
    function addRow() {
        const last = draft[draft.length - 1] || {};
        const r = withKey({ id: null, estate, division: last.division || '', phase: last.phase || '', block: '', year_planted: null, area_ha_prev: null, area_ha: null, palm_count_prev: null, palm_count: null, remark: '' });
        draft.push(r);
        $('blocksSec').querySelector('table.grid').style.display = '';
        const emp = $('gridEmpty'); if (emp) emp.remove();
        const tmp = document.createElement('tbody'); tmp.innerHTML = rowHtml(r, true, false);
        const tr = tmp.firstElementChild;
        const gb = $('gridBody'), total = gb.querySelector('tr.total');
        if (total) gb.insertBefore(tr, total); else gb.appendChild(tr);
        tr.querySelector('input[data-k="block"]').focus();
    }
    function delRow(tr) {
        const r = rowOf(tr); if (!r) return;
        if (r.id) removed.push(r.id);
        draft = draft.filter((x) => x !== r);
        tr.remove();
        if (!draft.length) drawBlocks();
    }
    // Drag a row by its handle to move it up or down (order kept at Save)
    function enableRowDrag(gb) {
        let src = null, ghost = null, offY = 0;
        gb.addEventListener('pointerdown', (e) => {
            const h = e.target.closest('.handle'); if (!h || e.button) return;
            src = h.closest('tr'); e.preventDefault();
            const r = src.getBoundingClientRect(); offY = e.clientY - r.top;
            ghost = src.cloneNode(true); ghost.className = 'drag-ghost'; ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
            document.body.appendChild(ghost); src.classList.add('ghost-src'); document.body.classList.add('dragging');
            try { h.setPointerCapture(e.pointerId); } catch (e2) {}
        });
        gb.addEventListener('pointermove', (e) => {
            if (!src) return;
            ghost.style.top = (e.clientY - offY) + 'px';
            const el = document.elementFromPoint(e.clientX, e.clientY), over = el && el.closest('#gridBody tr[data-key]');
            if (!over || over === src) return;
            const r = over.getBoundingClientRect();
            if (e.clientY < r.top + r.height / 2) over.before(src); else over.after(src);
        });
        const end = () => {
            if (!src) return;
            src.classList.remove('ghost-src'); ghost.remove(); ghost = null; document.body.classList.remove('dragging'); src = null;
            const keys = [...gb.querySelectorAll('tr[data-key]')].map((t) => t.dataset.key);
            draft.sort((a, b) => keys.indexOf(a._key) - keys.indexOf(b._key));
            // subtotals follow the new order
            const a = document.activeElement; drawBlocks(); if (a && a.dataset && a.dataset.k) { const el = $('gridBody').querySelector('tr[data-key="' + a.closest('tr').dataset.key + '"] input[data-k="' + a.dataset.k + '"]'); if (el) el.focus(); }
        };
        gb.addEventListener('pointerup', end); gb.addEventListener('pointercancel', end);
    }
    async function saveAll() {
        // check
        const missing = draft.find((r) => !(r.block || '').trim());
        if (missing) { toast('Every row needs a block'); const tr = $('gridBody').querySelector('tr[data-key="' + missing._key + '"] input[data-k="block"]'); if (tr) tr.focus(); return; }
        const seen = new Set();
        for (const r of draft) { const k = [r.division || '', r.phase || '', r.block].join('|'); if (seen.has(k)) { toast('Block ' + r.block + ' is listed twice under the same division and phase'); return; } seen.add(k); }
        const now = new Date().toISOString(), who = session.email || '';
        const toBody = (r, i) => {
            const yr = String(r.year_planted == null ? '' : r.year_planted).trim();
            return { estate, company_id: company.id, division: r.division || '', phase: r.phase || '', block: r.block.trim(), year_planted: /^\d{4}$/.test(yr) ? +yr : null,
                remark: /^\d{4}$/.test(yr) || !yr ? (r.remark || '') : yr, area_ha_prev: r.area_ha_prev, area_ha: r.area_ha, palm_count_prev: r.palm_count_prev, palm_count: r.palm_count, sort_order: i + 1, updated_by: who, updated_at: now };
        };
        $('saveBtn').disabled = true;
        try {
            for (const id of removed) await api('port_estate_blocks?id=eq.' + id, { method: 'DELETE' });
            for (let i = 0; i < draft.length; i++) {
                const r = draft[i], body = toBody(r, i);
                if (r.id) { if (changed(r) || (r.sort_order || 0) !== i + 1) await api('port_estate_blocks?id=eq.' + r.id, { method: 'PATCH', body: JSON.stringify(body) }); }
                else await api('port_estate_blocks', { method: 'POST', body: JSON.stringify(body) });
            }
            editing = false; draft = []; removed = [];
            toast('Saved'); load();
        } catch (e) {
            $('saveBtn').disabled = false;
            toast(/duplicate|unique/i.test(e.message) ? 'A block is listed twice under the same division and phase' : /area_ha_prev|palm_count_prev/.test(e.message) ? 'Run docs/run-after-setup.sql in Supabase first (before / after columns)' : 'Save failed: ' + e.message);
        }
    }
    async function saveMeta(k, v) {
        const body = { estate, company_id: company.id, prev_map_date: meta.prev_map_date || null, map_date: meta.map_date || null, updated_by: session.email || '', updated_at: new Date().toISOString() };
        body[k] = v ? v + '-01' : null;
        try { await api('port_estate_meta?on_conflict=estate', { method: 'POST', headers: Object.assign({}, H, { Prefer: 'resolution=merge-duplicates' }), body: JSON.stringify(body) }); meta = body; drawBlocks(); toast('Saved'); }
        catch (e) { toast(/port_estate_meta|prev_map_date/.test(e.message) ? 'Run docs/run-after-setup.sql in Supabase first (map dates)' : 'Save failed: ' + e.message); }
    }

    document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = () => b.closest('.modal').classList.remove('open'); });
    document.querySelectorAll('.modal').forEach((m) => { m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('open'); }); });

    (async () => {
        drawTop();
        if (company) await setCompany(company); else load();
    })();
})();
</script>
