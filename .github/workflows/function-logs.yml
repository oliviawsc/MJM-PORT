# Prints the recent Edge Function logs of the Supabase project, so a sign-in
# problem can be read from GitHub (Actions tab → "Function logs" → Run workflow)
# without the Supabase dashboard. Uses the same SUPABASE_ACCESS_TOKEN secret.
name: Function logs

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Function name (empty = all)'
        default: 'stock-sso'
      minutes:
        description: 'How far back, in minutes'
        default: '120'

env:
  PROJECT_REF: pxzvayptwpvuvlenmdwp

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Secrets set on the project (names only)
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | python3 -c 'import sys,json; print("\n".join(sorted(s["name"] for s in json.load(sys.stdin))))'
      - name: API keys of the project (legacy keys disabled?)
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=false" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps([{k: v for k, v in x.items() if k in ("name","type","description","inserted_at","secret_jwt_template","id") or "disab" in k} for x in d] if isinstance(d, list) else d, indent=1)[:3000])'
          echo; echo "legacy api keys enabled?:"; curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys/legacy" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | head -c 600; echo
      - name: Deployed functions
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | python3 -c 'import sys,json; [print(f["slug"], f["status"], "verify_jwt=" + str(f.get("verify_jwt")), f.get("updated_at")) for f in json.load(sys.stdin)]'
      - name: Logs (tries the Management API variants, prints raw)
        run: |
          START=$(date -u -d "-${{ github.event.inputs.minutes }} minutes" +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() { echo; echo "=== $1"; shift; curl -sS -G "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs" "$@" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | python3 -c '
          import sys,json
          raw=sys.stdin.read()
          try: d=json.loads(raw)
          except Exception: print(raw[:1500]); sys.exit()
          rows=d.get("result") if isinstance(d,dict) else d
          if not rows: print(json.dumps(d)[:1500]); sys.exit()
          for r in rows[:80]:
            print(r.get("timestamp"), r.get("status_code",""), (r.get("event_message") or r.get("msg") or "")[:300].replace("\n"," | "))
          '; }
          q "source=function_logs" --data-urlencode "source=function_logs" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END"
          q "source=function_edge_logs" --data-urlencode "source=function_edge_logs" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END"
          q "sql edge_logs" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" --data-urlencode "sql=select id, timestamp, event_message, r.status_code from edge_logs cross join unnest(metadata) as m cross join unnest(m.response) as r cross join unnest(m.request) as req where req.path like '%functions/v1/${{ github.event.inputs.function }}%' order by timestamp desc limit 40"
          q "sql function_logs plain" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" --data-urlencode "sql=select id, timestamp, event_message from function_logs order by timestamp desc limit 60"
