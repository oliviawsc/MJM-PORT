<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#166534">
    <title>User Access · Plantation Operation</title>
    <link rel="icon" type="image/png" href="../public/palm-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Same look as the Plantation Operation front page (../index.html) */
        :root { --ink: #0F172A; --mute: #64748B; --line: #E2E8F0; --brand: #166534; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: #F8FAFC; position: relative; overflow-x: hidden; }
        a { color: inherit; }
        .bg { position: fixed; inset: 0; z-index: -1; background: #F6F8FB; overflow: hidden; }
        .bg::before, .bg::after { content: ''; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
        .bg::before { width: 60vw; height: 60vw; left: -18vw; top: -22vw; background: #BBF7D0; }
        .bg::after { width: 55vw; height: 55vw; right: -20vw; bottom: -25vw; background: #BAE6FD; }
        .top { position: sticky; top: 0; z-index: 15; background: linear-gradient(90deg, rgba(224,242,254,.85), rgba(240,253,244,.85)); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(226,232,240,.8); }
        .top .in { max-width: 1400px; margin: 0 auto; height: 56px; padding: 0 16px 0 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
        .left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .back-slot { position: relative; height: 36px; flex: none; }
        .back { position: relative; display: inline-flex; align-items: center; height: 36px; padding: 0 9px; border-radius: 999px; border: 1px solid #CBD5E1; background: #fff;
                color: #334155; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; transition: background .15s; }
        .back svg { width: 18px; height: 18px; flex: none; }
        .back span { max-width: 0; opacity: 0; overflow: hidden; transition: max-width .2s ease, opacity .15s, margin .2s; }
        .back:hover, .back:focus-visible { background: #fff; box-shadow: 0 6px 18px rgba(15,23,42,.18); }
        .back:hover span, .back:focus-visible span { max-width: 200px; opacity: 1; margin-left: 6px; }
        .co-pick select { height: 36px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 10px; background: #fff; font: inherit; font-weight: 600; color: var(--ink); max-width: 40vw; }
        .title { font-weight: 700; font-size: 18px; letter-spacing: -.01em; text-align: center; white-space: nowrap; }
        .who { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
        .who .me { text-align: right; line-height: 1.25; min-width: 0; }
        .who .me b { display: block; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .who .me small { display: block; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .who .avatar { width: 32px; height: 32px; border-radius: 50%; background: #E2E8F0; display: grid; place-items: center; font-size: 14px; font-weight: 600; flex: none; overflow: hidden; }
        .who .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .who .logout { width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; color: #64748B; display: grid; place-items: center; cursor: pointer; }
        .who .logout:hover { background: rgba(241,245,249,.9); color: #0F172A; }
        .who .logout svg { width: 20px; height: 20px; }

        main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
        .bar .sp { flex: 1; }
        .input, .btn, select { height: 36px; border-radius: 10px; border: 1px solid #CBD5E1; background: #fff; font: inherit; font-size: 14px; color: var(--ink); }
        .input, select { padding: 0 10px; }
        .btn { padding: 0 14px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #F1F5F9; }
        .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
        .btn.primary:hover { background: #14532D; }
        .btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
        .btn:disabled { opacity: .55; cursor: default; }
        .wrap { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
        th { background: #F8FAFC; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--mute); position: sticky; top: 0; white-space: nowrap; }
        td .em { display: block; font-size: 12px; color: var(--mute); }
        .role { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .role.superadmin { background: #F3E8FF; color: #6B21A8; }
        .role.admin { background: #FFEDD5; color: #9A3412; }
        .role.hq_user { background: #DBEAFE; color: #1E40AF; }
        .role.estate_user { background: #DCFCE7; color: #166534; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
        .tag.set { background: #ECFDF5; color: #166534; border: 1px solid #A7F3D0; }
        .tag.gen { background: #F8FAFC; color: var(--mute); border: 1px dashed #CBD5E1; }
        .off { color: #B91C1C; font-weight: 600; font-size: 12.5px; }
        .muted { color: var(--mute); }
        .note { padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 14px; }
        .note.warn { background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; }
        .note.err { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; }
        .note.info { background: #F0F9FF; border: 1px solid #BAE6FD; color: #075985; }
        .empty { padding: 40px 20px; text-align: center; color: var(--mute); }
        .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; place-items: center; z-index: 20; padding: 16px; }
        .modal.open { display: grid; }
        .dlg { width: 100%; max-width: 640px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 92vh; overflow: auto; }
        .dlg h2 { margin: 0 0 2px; font-size: 18px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin: 14px 0; }
        .row2 label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--mute); }
        .grp { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
        .grp-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: #F8FAFC; font-weight: 700; font-size: 13.5px; }
        .grp-h .all { display: flex; gap: 4px; }
        .perm { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 14px; }
        .seg { display: inline-flex; border: 1px solid #CBD5E1; border-radius: 9px; overflow: hidden; flex: none; }
        .seg label { padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--mute); border-left: 1px solid #CBD5E1; }
        .seg label:first-child { border-left: 0; }
        .seg input { display: none; }
        .seg label:has(input:checked) { background: #475569; color: #fff; }
        .seg label.v:has(input:checked) { background: #2563EB; }
        .seg label.e:has(input:checked) { background: var(--brand); }
        .dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; position: sticky; bottom: -20px; background: #fff; padding: 10px 0 0; }
        .hint { font-size: 12.5px; color: var(--mute); margin: 6px 0 0; }
        .cohead { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: #ECFDF5; color: #14532D; font-weight: 700; font-size: 12.5px; border: 1px solid #A7F3D0; }
        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0F172A; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; display: none; z-index: 30; }
        @media (max-width: 640px) { .row2 { grid-template-columns: 1fr; } .who .me { display: none; } .top .in { grid-template-columns: auto 1fr auto; } .title { font-size: 16px; } th.opt, td.opt { display: none; } }
    </style>
</head>
<body>
    <div class="bg"></div>
    <header class="top"><div class="in">
        <div class="left">
            <span class="back-slot"><a class="back" id="back" href="../" title="Back to Plantation Operation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span>Back to Plantation Operation</span></a></span>
            <label class="co-pick" id="coPick" style="display:none;"><select id="coSelect" aria-label="Company"></select></label>
        </div>
        <div class="title">User Access</div>
        <div class="who" id="who"></div>
    </div></header>

    <main>
        <div id="note"></div>
        <div class="bar" id="bar" style="display:none">
            <input class="input" id="q" placeholder="Search name or email" style="min-width:220px">
            <select id="fRole"><option value="">All roles</option></select>
            <span class="sp"></span>
            <span class="muted" id="count"></span>
        </div>
        <div class="wrap" id="wrap" style="display:none">
            <table>
                <thead><tr><th>Name</th><th>Role</th><th class="opt">Page access in this company</th><th></th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <div class="modal" id="editModal"><div class="dlg">
        <h2 id="eName"></h2>
        <div class="muted" id="eEmail" style="font-size:13px"></div>
        <div style="margin-top:8px"><span class="cohead" id="eCo"></span></div>
        <div class="row2">
            <label>Role in this company <select id="eRole"></select></label>
            <label>Status in this company <select id="eStatus"><option value="active">Active</option><option value="inactive">Inactive (cannot open this company)</option></select></label>
        </div>
        <p class="hint" id="eRoleNote" style="margin:-6px 0 12px"></p>
        <div id="ePerms"></div>
        <p class="hint" id="eUnconf"></p>
        <div class="acts"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="eSave">Save for this company</button></div>
    </div></div>
    <div class="toast" id="toast"></div>

<script>
(function () {
    const SUPABASE_URL = 'https://pxzvayptwpvuvlenmdwp.supabase.co';
    const KEY = 'sb_publishable_tKap42sXnzGzmVUoLAw4xQ__bkXq8l_';
    const SESSION_KEY = 'opp_auth_session';
    const LOGOUT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>';
    // Log out of Plantation Operation and go back to the Intranet
    function logout() {
        localStorage.removeItem(SESSION_KEY);
        try { Object.keys(localStorage).filter((k) => /^sb-.*-auth-token$/.test(k)).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
        location.href = 'https://mjmelon.github.io/MJM-Intranet/';
    }
    const COMPANY_ID_KEY = 'port_company_id';   // shared with the front page
    const COMPANY_KEY = 'port_company';         // company name, shared with the front page
    const FN = 'port-user-access';
    const ROLE_LABEL = { superadmin: 'Super Admin', admin: 'Admin', hq_user: 'HQ User', estate_user: 'Estate User' };
    const ERR = {
        err_forbidden: 'Only the Super Admin and this company\'s Admins can manage user access here.',
        err_inactive: 'Your account is inactive.',
        err_not_found: 'That user no longer exists.',
        err_invalid: 'Something in the form is not valid.',
        err_no_company: 'Choose a company in the top bar.',
        err_not_set_up: 'User Access per company is not set up in the database yet (run the 20261128 SQL in Supabase).',
    };
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const $ = (id) => document.getElementById(id);
    const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), 3000); };

    let session = null;
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch (e) {}
    if (session && session.via !== 'intranet') session = null; // MJM Intranet sign-in only

    // ---- Companies: exactly the ones MJM Intranet gave this person; the one chosen on the front page first
    const companies = session && Array.isArray(session.companies) ? session.companies.filter((c) => c && typeof c === 'object' && c.id && c.name) : [];
    const params = new URLSearchParams(location.search);
    const findCompany = (v) => {
        const x = String(v || '').trim().toLowerCase();
        if (!x) return null;
        return companies.find((c) => c.id === v) || companies.find((c) => [c.code, c.short_name, c.name].some((k) => (k || '').toLowerCase() === x)) || null;
    };
    let company = findCompany(params.get('gw_company_id')) || findCompany(params.get('gw_company')) || findCompany(params.get('gw_company_name'));
    (function cleanUrl() { try { const u = new URL(location.href); ['gw_token', 'gw_company_id', 'gw_company', 'gw_company_name', 'gw_company_short', 'gw_estate', 'gw_estate_short'].forEach((k) => u.searchParams.delete(k)); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) {} })();
    if (!company) { try { company = findCompany(localStorage.getItem(COMPANY_ID_KEY)) || findCompany(localStorage.getItem(COMPANY_KEY)); } catch (e) {} }
    if (!company && companies.length === 1) company = companies[0];

    let data = null, editing = null;
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, KEY) : null;

    async function call(body) {
        if (!sb) throw new Error('err_network');
        const { data: s } = await sb.auth.getSession();
        if (!s || !s.session) throw new Error('err_forbidden');
        const res = await fetch(SUPABASE_URL + '/functions/v1/' + FN, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + s.session.access_token },
            body: JSON.stringify(Object.assign({ company_id: company && company.id }, body)),
        });
        const r = await res.json().catch(() => ({}));
        if (!res.ok || r.error) throw new Error(r.error || ('http_' + res.status));
        return r;
    }

    function note(html, kind) { $('note').innerHTML = html ? '<div class="note ' + (kind || 'warn') + '">' + html + '</div>' : ''; }

    function drawTop() {
        const name = session ? (session.name || session.email || '') : '';
        const photo = session && session.avatar && /^https:\/\/[a-z0-9]+\.supabase\.co\/storage\/v1\/object\/public\//.test(session.avatar) ? session.avatar : '';
        $('who').innerHTML = session ? '<div class="me"><b>' + esc(name) + '</b><small>' + esc(session.email || '') + '</small></div><span class="avatar">' +
            (photo ? '<img src="' + esc(photo) + '" alt="">' : esc(name.trim().slice(0, 1).toUpperCase() || '?')) + '</span>' +
            '<button type="button" class="logout" id="logout" title="Log out" aria-label="Log out">' + LOGOUT_SVG + '</button>' : '';
        if (session) $('logout').onclick = logout;
        const pick = $('coPick'), sel = $('coSelect');
        if (companies.length) {
            pick.style.display = '';
            sel.innerHTML = (company ? '' : '<option value="">— Choose company —</option>') +
                companies.map((c) => '<option value="' + esc(c.id) + '"' + (company && c.id === company.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('');
        } else pick.style.display = 'none';
        const u = new URL('../', location.href);
        if (company) u.searchParams.set('gw_company_id', company.id);
        $('back').href = u.pathname + u.search;
    }
    $('coSelect').onchange = (e) => {
        company = findCompany(e.target.value);
        try { if (company) { localStorage.setItem(COMPANY_ID_KEY, company.id); localStorage.setItem(COMPANY_KEY, company.name); } } catch (e2) {}
        drawTop(); load();
    };

    // ---- The list: people the Intranet gave THIS company
    function summary(u) {
        if (u.role === 'superadmin') return '<span class="muted">Everything</span>';
        const p = u.permissions || {}, edit = [], view = [];
        data.sections.forEach((s) => { if (p[s.id] === 'edit') edit.push(s.label); else if (p[s.id] === 'view') view.push(s.label); });
        if (!u.configured && (u.role === 'hq_user' || u.role === 'admin')) return '<span class="muted">Not set: views every page</span>';
        if (!edit.length && !view.length) return '<span class="muted">No pages</span>';
        return (edit.length ? '<b>Edit</b> ' + esc(edit.length > 3 ? edit.slice(0, 3).join(', ') + ' +' + (edit.length - 3) : edit.join(', ')) : '') +
            (edit.length && view.length ? ' · ' : '') + (view.length ? '<b>View</b> ' + esc(view.length > 3 ? view.slice(0, 3).join(', ') + ' +' + (view.length - 3) : view.join(', ')) : '');
    }
    function drawRows() {
        const q = $('q').value.trim().toLowerCase(), role = $('fRole').value;
        const list = data.users.filter((u) => (!q || (u.name || '').toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) && (!role || u.role === role));
        $('count').textContent = list.length + ' of ' + data.users.length + ' people in ' + data.company.name;
        $('rows').innerHTML = list.length ? list.map((u) =>
            '<tr><td><b>' + esc(u.name || '—') + '</b><span class="em">' + esc(u.email) + '</span></td>' +
            '<td><span class="role ' + esc(u.role) + '">' + esc(ROLE_LABEL[u.role] || u.role) + '</span>' +
                (u.role !== 'superadmin' ? ' <span class="tag ' + (u.set_here ? 'set">Set for this company' : 'gen">General access') + '</span>' : '') +
                (u.status === 'inactive' ? '<div class="off">Inactive in this company</div>' : '') + '</td>' +
            '<td class="opt" style="font-size:13px">' + summary(u) + '</td>' +
            '<td style="text-align:right">' + (u.can_edit ? '<button class="btn sm" data-edit="' + u.id + '">Edit access</button>' : '') + '</td></tr>').join('')
            : '<tr><td colspan="4" class="empty">No one matches.</td></tr>';
    }

    // ---- Edit dialog
    const groups = () => {
        const g = new Map();
        data.sections.forEach((s) => { if (!g.has(s.group)) g.set(s.group, []); g.get(s.group).push(s); });
        return [...g.entries()];
    };
    const seg = (sid, val) => '<span class="seg">' + [['none', 'None', ''], ['view', 'View', 'v'], ['edit', 'Edit', 'e']].map(([v, l, c]) =>
        '<label class="' + c + '"><input type="radio" name="p_' + esc(sid) + '" value="' + v + '"' + (val === v ? ' checked' : '') + '><span>' + l + '</span></label>').join('') + '</span>';
    function drawPerms(perms) {
        const mobile = $('eRole').value === 'estate_user';
        $('ePerms').innerHTML = groups()
            .filter(([g]) => (g === 'Estate User (mobile)') === mobile)
            .map(([g, secs]) =>
                '<div class="grp"><div class="grp-h"><span>' + esc(g) + '</span><span class="all">' +
                ['none', 'view', 'edit'].map((v) => '<button type="button" class="btn sm" data-all="' + esc(g) + '" data-v="' + v + '">All ' + v + '</button>').join('') +
                '</span></div>' + secs.map((s) => '<div class="perm"><span>' + esc(s.label) + '</span>' + seg(s.id, perms[s.id] || 'none') + '</div>').join('') + '</div>').join('');
    }
    function readPerms() {
        const out = {};
        $('ePerms').querySelectorAll('input[type=radio]:checked').forEach((r) => { if (r.value !== 'none') out[r.name.slice(2)] = r.value; });
        return out;
    }
    function openEdit(id) {
        const u = data.users.find((x) => x.id === id);
        if (!u) return;
        editing = u;
        $('eName').textContent = u.name || u.email;
        $('eEmail').textContent = u.email;
        $('eCo').textContent = '🏢 ' + data.company.name;
        const roles = data.roles.slice();
        if (!roles.some((r) => r.value === u.role)) roles.unshift({ value: u.role, label: ROLE_LABEL[u.role] || u.role, note: '' });
        $('eRole').innerHTML = roles.map((r) => '<option value="' + esc(r.value) + '"' + (r.value === u.role ? ' selected' : '') + '>' + esc(r.label) + '</option>').join('');
        $('eStatus').value = u.status === 'inactive' ? 'inactive' : 'active';
        const roleNote = () => { const r = data.roles.find((x) => x.value === $('eRole').value); $('eRoleNote').textContent = r ? r.note : ''; };
        roleNote();
        $('eRole').onchange = () => { roleNote(); drawPerms(readPerms()); };
        drawPerms(u.permissions || {});
        $('eUnconf').textContent = u.set_here
            ? 'Applies to ' + data.company.name + ' only. Other companies keep their own access.'
            : 'Not set for ' + data.company.name + ' yet: this person uses their general access here' + (!u.configured && u.role === 'hq_user' ? ' (views every page)' : '') + '. Saving sets it for ' + data.company.name + ' only.';
        $('editModal').classList.add('open');
    }
    async function save() {
        if (!editing) return;
        const btn = $('eSave');
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
            const r = await call({ action: 'save', id: editing.id, role: $('eRole').value, status: $('eStatus').value, permissions: readPerms() });
            Object.assign(editing, { role: r.user.role, status: r.user.status, permissions: r.user.permissions, configured: true, set_here: true });
            $('editModal').classList.remove('open');
            drawRows();
            toast('Saved for ' + data.company.name + '. ' + (editing.name || editing.email) + ' gets it the next time they open PORT.');
        } catch (e) {
            toast('Could not save: ' + (ERR[e.message] || e.message));
        }
        btn.disabled = false; btn.textContent = 'Save for this company';
    }

    document.addEventListener('click', (e) => {
        const ed = e.target.closest('[data-edit]');
        if (ed) return openEdit(Number(ed.dataset.edit));
        const all = e.target.closest('[data-all]');
        if (all) {
            const g = groups().find(([name]) => name === all.dataset.all);
            if (g) g[1].forEach((s) => { const r = document.querySelector('input[name="p_' + s.id + '"][value="' + all.dataset.v + '"]'); if (r) r.checked = true; });
            return;
        }
        if (e.target.closest('[data-close]') || e.target.id === 'editModal') $('editModal').classList.remove('open');
    });
    $('eSave').addEventListener('click', save);
    ['q', 'fRole'].forEach((id) => $(id).addEventListener('input', () => data && drawRows()));
    $('fRole').innerHTML = '<option value="">All roles</option>' + Object.keys(ROLE_LABEL).map((r) => '<option value="' + r + '">' + ROLE_LABEL[r] + '</option>').join('');

    async function load() {
        $('bar').style.display = 'none'; $('wrap').style.display = 'none';
        if (!session) return note('You are not signed in. Please open Plantation Operation from <a href="https://mjmelon.github.io/MJM-Intranet/">MJM Intranet</a>.');
        if (!company) return note(companies.length ? 'Choose a company in the top bar.' : 'No company has been given to you in MJM Intranet.');
        note('Loading ' + esc(company.name) + '…', 'info');
        try {
            data = await call({ action: 'list' });
        } catch (e) {
            return note('Could not load users: ' + esc(ERR[e.message] || e.message), 'err');
        }
        note(data.me.role === 'admin' ? 'As Admin of ' + esc(data.company.name) + ' you manage its HQ Users and Estate Users.' : '', 'info');
        $('bar').style.display = ''; $('wrap').style.display = '';
        drawRows();
    }

    drawTop();
    load();
})();
</script>
</body>
</html>
