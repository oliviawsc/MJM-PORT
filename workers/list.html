<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#166534">
    <title>Worker List · Plantation Operation</title>
    <link rel="icon" type="image/png" href="../public/palm-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="workers.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg"></div>
    <header class="top"><div class="in">
        <div class="left">
            <span class="back-slot"><a class="back" id="back" href="index.html" title="Back to Worker Manage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span>Back to Worker Manage</span></a></span>
            <div class="co-pick" id="coPick" style="display:none;"><button type="button" class="co-btn" id="coBtn" aria-haspopup="listbox" title="Company"></button><div class="co-menu" id="coMenu" role="listbox"></div></div>
            <div class="co-pick" id="esPick" style="display:none;"><button type="button" class="co-btn es-btn" id="esBtn" aria-haspopup="listbox" title="Location"></button><div class="co-menu" id="esMenu" role="listbox"></div></div>
        </div>
        <div class="title">Worker List</div>
        <div class="who" id="who"></div>
    </div></header>

    <main>
        <div id="note"></div>
        <div class="bar" id="bar" style="display:none">
            <input class="input search" id="q" type="search" placeholder="Search" autocomplete="off">
        </div>
        <div class="wrap" id="wrap" style="display:none">
            <table class="wl">
                <thead id="head"></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <!-- Worker profile: view, and edit mode (pencil) -->
    <div class="modal" id="viewModal"><div class="dlg profile" id="pfDlg" role="dialog" aria-modal="true" aria-labelledby="pfName">
        <div class="pf-top"><h2><span id="pfName"></span><span class="edit-tag">Editing</span></h2>
            <div class="tools"><button class="ibtn ghost" type="button" id="pfEdit" title="Edit profile" aria-label="Edit profile"></button>
            <button class="pf-x" type="button" data-close aria-label="Close">&times;</button></div></div>
        <div class="pf-body" id="pfBody"></div>
        <div class="pf-foot"><button class="btn" type="button" id="pfCancel">Cancel</button><button class="btn primary" type="button" id="pfSave">Save</button></div>
    </div></div>
    <div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
(function () {
    const W = window.PortWorkers, esc = W.esc, $ = (id) => document.getElementById(id);
    const SUPABASE_URL = 'https://pxzvayptwpvuvlenmdwp.supabase.co';
    const KEY = 'sb_publishable_tKap42sXnzGzmVUoLAw4xQ__bkXq8l_';
    const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), 3200); };
    const ERR = {
        err_forbidden: 'You do not have access to Worker Manage in this company. Ask your Admin to set it in User Access.',
        err_invalid: 'Something in the form is not valid.',
        err_network: 'Could not connect. Please try again.',
    };
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, KEY) : null;
    const svg = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
    const I_VIEW = svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>');
    const I_HIDE = svg('<path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.1 9.1 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="m2 2 20 20"/>');
    const I_EDIT = svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/>');

    // Columns, in order. MANTAP group (light), then "coming soon" (grey).
    const MANTAP = [{ k: 'login_id', label: 'Login ID' }, { k: 'login_pin', label: 'Login PIN' }];
    const SOON = ['Join Date', '1st Recruitment Claim', '2nd Recruitment Claim', '3rd Recruitment Claim', 'Passport Number', 'Passport Expiry',
        'SOCSO Number', 'Permit Issued Date', 'Levy Expiry Date', 'Levy Number', 'Levy Status', 'Labour License Expiry Date', 'Resign Date',
        'Service Period', 'Status', 'EPF Claim', 'Remark'];
    const TOTAL_COLS = 6 + MANTAP.length + SOON.length + 1; // No., Name, Worker ID, Opispro ID, Gender, Type … Action
    const LABEL = { male: 'Male', female: 'Female', local: 'Local', foreign: 'Foreign' };

    let workers = null, current = null, editing = false;
    // A worker's location names (older data) may be longer than the Intranet's
    // location name, e.g. "Mega Jutamas (Sg Rait)" for location "Sg Rait".
    const norm = (x) => String(x || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    // "All locations" in a company with locations: show each worker's location
    const showLoc = () => (!W.location || (W.locationSet() || []).length > 1) && W.locations().length > 0 && W.locations()[0] !== (W.company && W.company.name);
    // Location only, never "Company (Location)": the Intranet short name when there is one
    const bare = (e) => {
        const co = W.company ? W.company.name.trim() : '';
        let x = String(e || '').trim();
        if (co && x.toLowerCase().startsWith(co.toLowerCase()) && x.length > co.length) x = x.slice(co.length).replace(/^[\s\-–:,(]+|[)\s]+$/g, '');
        return x || String(e || '');
    };
    const locOf = (w) => {
        const hits = W.locations().filter((l) => atLocation(w, l));
        const co = W.company ? norm(W.company.name) : '';
        const names = hits.length ? hits : (w.estates || []).map(bare).filter((n) => n && norm(n) !== co);
        return names.map((n) => W.shortName(n) || n).join(', ');
    };
    const locTitle = (w) => W.locations().filter((l) => atLocation(w, l)).join(', ') || 'No location set yet: choose it in Edit profile';
    const workerLoc = (w) => W.locations().find((l) => atLocation(w, l)) || '';
    const atLocation = (w, loc) => !loc || (w.estates || []).some((e) => { const a = norm(e), b = norm(loc); return a === b || (' ' + a + ' ').includes(' ' + b + ' '); });
    const shownPins = new Map(); // worker id → PIN, while shown

    async function call(body) {
        if (!sb) throw new Error('err_network');
        const { data: s } = await sb.auth.getSession();
        if (!s || !s.session) throw new Error('err_forbidden');
        const res = await fetch(SUPABASE_URL + '/functions/v1/mantap-worker-admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + s.session.access_token },
            body: JSON.stringify(Object.assign({ company_id: W.company && W.company.id, locations: W.locations() }, body)),
        });
        const r = await res.json().catch(() => ({}));
        if (!res.ok || r.error) throw new Error(r.error || ('http_' + res.status));
        return r;
    }
    const note = (html, kind) => { $('note').innerHTML = html ? '<p class="note ' + (kind || 'warn') + '">' + html + '</p>' : ''; };
    const loginId = (email) => String(email || '').replace(/@psms\.app$/i, '');
    const pill = (v) => v ? '<span class="pill ' + esc(v) + '">' + LABEL[v] + '</span>' : '<span class="unset">Not set</span>';
    const txt = (v) => v ? esc(v) : '<span class="unset">—</span>';

    // MANTAP PIN: dots, with an eye to show it (Edit access only)
    function pinHtml(w) {
        const shown = shownPins.get(w.id);
        return '<span class="pinbox"><span class="pinval' + (shown ? '' : ' pin') + '">' + (shown ? esc(shown) : '••••••') + '</span>' +
            (W.canEdit() ? '<button type="button" class="ibtn" data-pin="' + w.id + '" title="' + (shown ? 'Hide PIN' : 'Show PIN') + '" aria-label="' + (shown ? 'Hide PIN' : 'Show PIN') + '">' + (shown ? I_HIDE : I_VIEW) + '</button>' : '') + '</span>';
    }
    async function togglePin(id) {
        if (shownPins.has(id)) { shownPins.delete(id); return redraw(); }
        try {
            const r = await call({ action: 'reveal_pin', id });
            if (!r.pin) return toast('This PIN was set before PINs could be shown. Reset it once in Mantap, then it can be seen here.');
            shownPins.set(id, r.pin); redraw();
            setTimeout(() => { if (shownPins.get(id) === r.pin) { shownPins.delete(id); redraw(); } }, 30000); // hides again after 30 s
        } catch (e) { toast('Could not show the PIN: ' + (ERR[e.message] || e.message)); }
    }
    function redraw() { drawRows(); if (current && !editing) drawProfile(); }

    function drawHead() {
        $('head').innerHTML =
            '<tr><th class="c-no" rowspan="2">No.</th>' + (showLoc() ? '<th class="c-loc" rowspan="2">Location</th>' : '') + '<th class="c-name" rowspan="2">Name</th><th rowspan="2">Worker ID</th><th rowspan="2">Opispro Worker ID</th>' +
            '<th rowspan="2">Gender</th><th rowspan="2">Type</th>' +
            '<th class="grp mantap" colspan="' + MANTAP.length + '">MANTAP</th>' +
            '<th class="soon" colspan="' + SOON.length + '">Coming soon in worker management system</th>' +
            '<th class="c-act" rowspan="2">Action</th></tr>' +
            '<tr>' + MANTAP.map((c) => '<th class="mantap">' + esc(c.label) + '</th>').join('') + SOON.map((l) => '<th class="later">' + esc(l) + '</th>').join('') + '</tr>';
        requestAnimationFrame(() => {   // the second header row sticks right under the first one
            const h = $('head').rows[0].getBoundingClientRect().height;
            [...$('head').rows[1].cells].forEach((c) => { c.style.top = h + 'px'; });
        });
    }
    function drawRows() {
        const q = $('q').value.trim().toLowerCase();
        const list = (workers || []).filter((w) =>
            (!q || [w.name, loginId(w.email), w.workerNo, w.opisproId].some((v) => String(v || '').toLowerCase().includes(q))) &&
            (!W.locationSet() || W.locationSet().some((l) => atLocation(w, l))));
        $('rows').innerHTML = list.length ? list.map((w, i) => '<tr>' +
                '<td class="c-no">' + (i + 1) + '</td>' +
                (showLoc() ? '<td class="c-loc" title="' + esc(locTitle(w)) + '">' + (locOf(w) ? '<span class="locpill">' + esc(locOf(w)) + '</span>' : '<span class="unset">Not set</span>') + '</td>' : '') +
                '<td class="c-name"><b>' + esc(w.name) + '</b></td>' +
                '<td>' + txt(w.workerNo) + '</td><td>' + txt(w.opisproId) + '</td>' +
                '<td>' + pill(w.gender) + '</td><td>' + pill(w.workerType) + '</td>' +
                '<td class="mantap">' + esc(loginId(w.email)) + '</td><td class="mantap">' + pinHtml(w) + '</td>' +
                SOON.map(() => '<td class="later">—</td>').join('') +
                '<td class="c-act"><div class="acts"><button class="ibtn" data-view="' + w.id + '" title="View profile" aria-label="View profile">' + I_VIEW + '</button>' +
                (W.canEdit() ? '<button class="ibtn" data-edit="' + w.id + '" title="Edit profile" aria-label="Edit profile">' + I_EDIT + '</button>' : '') + '</div></td></tr>').join('')
            : '<tr><td class="nodata" colspan="' + (TOTAL_COLS + (showLoc() ? 1 : 0)) + '">No data</td></tr>';
        document.querySelector('table.wl').classList.toggle('with-loc', showLoc());
        // Name stays right after No. (and Location) while scrolling sideways
        requestAnimationFrame(() => {
            const no = document.querySelector('#head .c-no'), lc = document.querySelector('#head .c-loc');
            const left = (no ? no.getBoundingClientRect().width : 52) + (lc ? lc.getBoundingClientRect().width : 0);
            document.querySelectorAll('table.wl .c-name').forEach((c) => { c.style.left = left + 'px'; });
        });
    }

    async function load() {
        W.drawTop('index.html', { allLocations: true });
        $('bar').style.display = 'none'; $('wrap').style.display = 'none';
        if (!W.session) return note('You are not signed in. Please open Plantation Operation from <a href="https://mjmelon.github.io/MJM-Intranet/">MJM Intranet</a>.');
        if (!W.company) return note('Choose a company in the top bar.');
        if (!W.canView()) return note(ERR.err_forbidden);
        note('Loading…', 'info');
        try { workers = (await call({ action: 'list' })).workers || []; }
        catch (e) { return note('Could not load workers: ' + esc(ERR[e.message] || e.message), 'err'); }
        shownPins.clear();
        note('');
        // Locations and their short names fresh from the Intranet, then redraw
        W.refreshLocations().then((ok) => { if (ok && workers) { drawHead(); drawRows(); } });
        drawHead();
        $('bar').style.display = ''; $('wrap').style.display = '';
        drawRows();
    }

    // ---- Worker profile window: view, and edit mode (pencil; Cancel / Save at the bottom right)
    const FACE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>';
    const field = (k, v) => '<div class="pf-f"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div></div>';
    const sel = (id, val, opts) => '<select id="' + id + '"><option value="">— Not set —</option>' + opts.map(([v, l]) => '<option value="' + v + '"' + (v === val ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>';
    const inp = (id, val) => '<input id="' + id + '" maxlength="50" value="' + esc(val || '') + '" autocomplete="off">';
    function drawProfile() {
        const w = current;
        $('pfName').textContent = w.name;
        $('pfDlg').classList.toggle('editing', editing);
        $('pfEdit').style.display = W.canEdit() && !editing ? '' : 'none';
        const soon = (labels) => labels.map((l) => field(l, '—')).join('');
        $('pfBody').innerHTML =
            '<div class="pf-head"><div class="pf-face" title="Photo coming soon"><div>' + FACE + '<small>No photo</small></div></div>' +
            '<div class="pf-grid">' +
                (W.locations().length && W.locations()[0] !== (W.company && W.company.name)
                    ? field('Location', editing ? sel('fLoc', workerLoc(w), W.locations().map((l) => [l, W.shortName(l) ? l + ' (' + W.shortName(l) + ')' : l]))
                        : (workerLoc(w) ? esc(workerLoc(w)) + (W.shortName(workerLoc(w)) ? ' <span class="unset">(' + esc(W.shortName(workerLoc(w))) + ')</span>' : '') : '<span class="unset">Not set</span>')) + field('', '')
                    : '') +
                field('Worker ID', editing ? inp('fNo', w.workerNo) : txt(w.workerNo)) +
                field('Opispro Worker ID', editing ? inp('fOp', w.opisproId) : txt(w.opisproId)) +
                field('Gender', editing ? sel('fGender', w.gender, [['male', 'Male'], ['female', 'Female']]) : (w.gender ? LABEL[w.gender] : '<span class="unset">Not set</span>')) +
                field('Type', editing ? sel('fType', w.workerType, [['local', 'Local'], ['foreign', 'Foreign']]) : (w.workerType ? LABEL[w.workerType] : '<span class="unset">Not set</span>')) +
                field('MANTAP Login ID', esc(loginId(w.email))) +
                field('MANTAP Login PIN', pinHtml(w)) +
            '</div></div>' +
            '<div class="pf-sec soon"><h3>Employment <small>Coming soon</small></h3><div class="pf-grid">' + soon(['Join Date', 'Service Period', 'Resign Date', 'Status']) + '</div></div>' +
            '<div class="pf-sec soon"><h3>Identity &amp; Work Permit Documents <small>Coming soon</small></h3><div class="pf-grid">' +
                soon(['Passport Number', 'Passport Expiry', 'Permit Issued Date', 'Labour License Expiry Date', 'Levy Number', 'Levy Status', 'Levy Expiry Date', 'SOCSO Number']) + '</div></div>' +
            '<div class="pf-sec soon"><h3>Claims <small>Coming soon</small></h3><div class="pf-grid">' +
                soon(['1st Recruitment Claim', '2nd Recruitment Claim', '3rd Recruitment Claim', 'EPF Claim']) + '</div></div>' +
            '<div class="pf-sec soon"><h3>Remark <small>Coming soon</small></h3><div class="pf-grid">' + field('Remark', '—') + '</div></div>';
        if (editing) { const f = $('fNo'); if (f) f.focus(); }
    }
    function openProfile(id, edit) {
        current = (workers || []).find((x) => x.id === id); if (!current) return;
        editing = !!edit && W.canEdit();
        $('pfEdit').innerHTML = I_EDIT;
        drawProfile();
        $('viewModal').classList.add('open');
    }
    const closeProfile = () => { $('viewModal').classList.remove('open'); current = null; editing = false; };
    $('pfEdit').onclick = () => { editing = true; drawProfile(); };
    $('pfCancel').onclick = () => { editing = false; drawProfile(); };
    $('pfSave').onclick = async () => {
        if (!current) return;
        const v = { workerNo: $('fNo').value.trim(), opisproId: $('fOp').value.trim(), gender: $('fGender').value, workerType: $('fType').value };
        const locEl = $('fLoc'), newLoc = locEl ? locEl.value : '';
        if (locEl && newLoc && newLoc !== workerLoc(current)) v.location = newLoc;
        const btn = $('pfSave'); btn.disabled = true; btn.textContent = 'Saving…';
        try {
            await call(Object.assign({ action: 'set_details', id: current.id }, v));
            if (v.location) { const co = W.company ? norm(W.company.name) : ''; const scope = W.locations().map(norm);
                current.estates = (current.estates || []).filter((e) => !scope.includes(norm(e)) && norm(e) !== co && !W.locations().some((l) => atLocation({ estates: [e] }, l))).concat([v.location]); delete v.location; }
            Object.assign(current, v);
            editing = false; drawProfile(); drawRows(); toast('Saved');
        } catch (e) { toast('Could not save: ' + (ERR[e.message] || (/worker_no|opispro_id|port_worker_details/.test(e.message) ? 'run the latest worker SQL in Supabase first' : e.message))); }
        btn.disabled = false; btn.textContent = 'Save';
    };

    document.addEventListener('click', (e) => {
        const pn = e.target.closest('[data-pin]'); if (pn) return togglePin(Number(pn.dataset.pin));
        const vw = e.target.closest('[data-view]'); if (vw) return openProfile(Number(vw.dataset.view), false);
        const ed = e.target.closest('[data-edit]'); if (ed) return openProfile(Number(ed.dataset.edit), true);
        if (e.target.closest('[data-close]') || e.target.id === 'viewModal') closeProfile();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('viewModal').classList.contains('open')) { if (editing) { editing = false; drawProfile(); } else closeProfile(); } });
    $('q').addEventListener('input', () => workers && drawRows());
    W.onLocationChange(() => { if (workers) { drawHead(); drawRows(); } });
    W.onCompanyChange(() => load());
    load();
})();
</script>
</body>
</html>
