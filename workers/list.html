<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#166534">
    <title>Worker List · Plantation Operation</title>
    <link rel="icon" type="image/png" href="../public/palm-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="workers.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg"></div>
    <header class="top"><div class="in">
        <div class="left">
            <span class="back-slot"><a class="back" id="back" href="index.html" title="Back to Worker Manage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span>Back to Worker Manage</span></a></span>
            <label class="co-pick" id="coPick" style="display:none;"><select id="coSelect" aria-label="Company"></select></label>
        </div>
        <div class="title">Worker List</div>
        <div class="who" id="who"></div>
    </div></header>

    <main>
        <div id="note"></div>
        <div class="bar" id="bar" style="display:none">
            <input class="input search" id="q" type="search" placeholder="Search name or login ID" autocomplete="off">
            <select id="loc" aria-label="Location" style="display:none"></select>
            <span class="sp"></span>
            <span class="muted" id="count" style="font-size:13px"></span>
        </div>
        <div class="wrap" id="wrap" style="display:none">
            <table class="wl">
                <thead><tr id="head"></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <div class="modal" id="editModal"><div class="dlg">
        <h2 id="eName"></h2>
        <div class="muted" id="eId" style="font-size:13px"></div>
        <label>Gender
            <select id="eGender"><option value="">— Not set —</option><option value="male">Male</option><option value="female">Female</option></select></label>
        <label>Type
            <select id="eType"><option value="">— Not set —</option><option value="local">Local</option><option value="foreign">Foreign</option></select></label>
        <div class="acts"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="eSave">Save</button></div>
    </div></div>
    <div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
(function () {
    const W = window.PortWorkers, esc = W.esc, $ = (id) => document.getElementById(id);
    const SUPABASE_URL = 'https://pxzvayptwpvuvlenmdwp.supabase.co';
    const KEY = 'sb_publishable_tKap42sXnzGzmVUoLAw4xQ__bkXq8l_';
    const MANTAP_URL = 'https://mjmelon.github.io/Mantap/';
    const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), 2600); };
    const ERR = {
        err_forbidden: 'Only the Super Admin and this company\'s Admins can open the worker list.',
        err_invalid: 'Something in the form is not valid.',
        err_network: 'Could not connect. Please try again.',
    };
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, KEY) : null;

    // Columns. Name, Gender, Type now; the grey ones are built later.
    const COLS = [
        { k: 'name', label: 'Name', cls: 'c-name' },
        { k: 'gender', label: 'Gender' },
        { k: 'type', label: 'Type' },
        { k: 'login_id', label: 'MANTAP Login ID', later: true },
        { k: 'login_pin', label: 'MANTAP Login PIN', later: true },
        { k: 'join', label: 'Join Date', later: true },
        { k: 'claim1', label: '1st Recruitment Claim', later: true },
        { k: 'claim2', label: '2nd Recruitment Claim', later: true },
        { k: 'claim3', label: '3rd Recruitment Claim', later: true },
        { k: 'passport', label: 'Passport Number', later: true },
        { k: 'passport_exp', label: 'Passport Expiry', later: true },
        { k: 'socso', label: 'SOCSO Number', later: true },
        { k: 'permit_issued', label: 'Permit Issued Date', later: true },
        { k: 'levy_exp', label: 'Levy Expiry Date', later: true },
        { k: 'levy_no', label: 'Levy Number', later: true },
        { k: 'levy_status', label: 'Levy Status', later: true },
        { k: 'license_exp', label: 'Labour License Expiry Date', later: true },
        { k: 'resign', label: 'Resign Date', later: true },
        { k: 'service', label: 'Service Period', later: true },
        { k: 'status', label: 'Status', later: true },
        { k: 'epf', label: 'EPF Claim', later: true },
        { k: 'remark', label: 'Remark', later: true },
        { k: 'action', label: 'Action', cls: 'c-act' },
    ];
    const LABEL = { male: 'Male', female: 'Female', local: 'Local', foreign: 'Foreign' };

    let workers = null, editing = null, loc = '';

    async function call(body) {
        if (!sb) throw new Error('err_network');
        const { data: s } = await sb.auth.getSession();
        if (!s || !s.session) throw new Error('err_forbidden');
        const res = await fetch(SUPABASE_URL + '/functions/v1/mantap-worker-admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + s.session.access_token },
            body: JSON.stringify(Object.assign({ company_id: W.company && W.company.id }, body)),
        });
        const r = await res.json().catch(() => ({}));
        if (!res.ok || r.error) throw new Error(r.error || ('http_' + res.status));
        return r;
    }
    const note = (html, kind) => { $('note').innerHTML = html ? '<p class="note ' + (kind || 'warn') + '">' + html + '</p>' : ''; };
    const loginId = (email) => String(email || '').replace(/@psms\.app$/i, '');

    function drawLocations() {
        const list = W.locations();
        if (!list.includes(loc)) loc = '';
        $('loc').style.display = list.length > 1 ? '' : 'none'; // only when the company has more than one location
        $('loc').innerHTML = '<option value="">All locations</option>' + list.map((n) => '<option' + (n === loc ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
    }

    function cell(c, w) {
        if (c.later) return '<td class="later">—</td>';
        if (c.k === 'name') return '<td class="c-name"><b>' + esc(w.name) + '</b><span class="em">' + esc(w.estates.join(', ')) + '</span></td>';
        if (c.k === 'gender') return '<td>' + (w.gender ? '<span class="pill ' + esc(w.gender) + '">' + LABEL[w.gender] + '</span>' : '<span class="unset">Not set</span>') + '</td>';
        if (c.k === 'type') return '<td>' + (w.workerType ? '<span class="pill ' + esc(w.workerType) + '">' + LABEL[w.workerType] + '</span>' : '<span class="unset">Not set</span>') + '</td>';
        if (c.k === 'action') return '<td class="c-act"><div class="acts"><button class="btn sm" data-edit="' + w.id + '">Edit</button><button class="btn sm" data-profile="' + w.id + '">Profile</button></div></td>';
        return '<td></td>';
    }

    function drawRows() {
        $('head').innerHTML = COLS.map((c) => '<th class="' + (c.cls || '') + (c.later ? ' later' : '') + '"' + (c.later ? ' title="Coming later"' : '') + '>' + esc(c.label) + '</th>').join('');
        const q = $('q').value.trim().toLowerCase();
        const list = (workers || []).filter((w) =>
            (!q || w.name.toLowerCase().includes(q) || loginId(w.email).toLowerCase().includes(q)) &&
            (!loc || w.estates.includes(loc)));
        $('count').textContent = list.length + ' of ' + (workers || []).length + ' workers';
        $('rows').innerHTML = list.length ? list.map((w) => '<tr>' + COLS.map((c) => cell(c, w)).join('') + '</tr>').join('')
            : '<tr><td class="c-name empty" colspan="1">' + (workers && workers.length ? 'No worker matches.' : 'No workers in ' + esc(W.company.name) + ' yet.') + '</td><td colspan="' + (COLS.length - 1) + '"></td></tr>';
    }

    async function load() {
        W.drawTop('index.html');
        $('bar').style.display = 'none'; $('wrap').style.display = 'none';
        if (!W.session) return note('You are not signed in. Please open Plantation Operation from <a href="https://mjmelon.github.io/MJM-Intranet/">MJM Intranet</a>.');
        if (!W.company) return note('Choose a company in the top bar.');
        if (!W.canManage()) return note(ERR.err_forbidden);
        note('Loading ' + esc(W.company.name) + '…', 'info');
        try {
            const r = await call({ action: 'list' });
            workers = r.workers || [];
        } catch (e) {
            return note('Could not load workers: ' + esc(ERR[e.message] || e.message), 'err');
        }
        note('');
        drawLocations();
        $('bar').style.display = ''; $('wrap').style.display = '';
        drawRows();
    }

    // Action: Edit (gender, type) and Profile (the worker's page in Mantap)
    function openEdit(id) {
        const w = workers.find((x) => x.id === id); if (!w) return;
        editing = w;
        $('eName').textContent = w.name;
        $('eId').textContent = 'Login ID: ' + loginId(w.email);
        $('eGender').value = w.gender || '';
        $('eType').value = w.workerType || '';
        $('editModal').classList.add('open');
    }
    $('eSave').onclick = async () => {
        if (!editing) return;
        const btn = $('eSave'); btn.disabled = true; btn.textContent = 'Saving…';
        try {
            await call({ action: 'set_details', id: editing.id, gender: $('eGender').value, workerType: $('eType').value });
            editing.gender = $('eGender').value; editing.workerType = $('eType').value;
            $('editModal').classList.remove('open'); drawRows(); toast('Saved');
        } catch (e) { toast('Could not save: ' + (ERR[e.message] || (/port_worker_details/.test(e.message) ? 'run the 20261129 SQL in Supabase first' : e.message))); }
        btn.disabled = false; btn.textContent = 'Save';
    };
    async function openProfile(id) {
        let hand = '';
        try {
            const { data: s } = await sb.auth.getSession();
            if (s && s.session) hand = '&pt=' + encodeURIComponent(s.session.access_token) + '&pr=' + encodeURIComponent(s.session.refresh_token);
        } catch (e) {}
        location.href = MANTAP_URL + '#/portal/workers/' + id + '?co=' + encodeURIComponent(W.company.id) + '&con=' + encodeURIComponent(W.company.name) + hand;
    }
    document.addEventListener('click', (e) => {
        const ed = e.target.closest('[data-edit]'); if (ed) return openEdit(Number(ed.dataset.edit));
        const pf = e.target.closest('[data-profile]'); if (pf) return openProfile(Number(pf.dataset.profile));
        if (e.target.closest('[data-close]') || e.target.id === 'editModal') $('editModal').classList.remove('open');
    });
    $('q').addEventListener('input', () => workers && drawRows());
    $('loc').addEventListener('change', (e) => { loc = e.target.value; drawRows(); });
    W.onCompanyChange(() => { loc = ''; load(); });
    load();
})();
</script>
</body>
</html>
