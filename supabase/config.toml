# Plantation Stock Edge Functions (Supabase project pxzvayptwpvuvlenmdwp).
# supabase link --project-ref pxzvayptwpvuvlenmdwp
# supabase functions deploy stock-auth
project_id = "PlantationStock"

[functions.stock-auth]
# sign_in is called before the user has a session (the anon key is still
# sent); me / change_password check the caller's JWT inside the function.
verify_jwt = false

[functions.stock-sso]
# Called right after the Intranet redirect (?gw_token=…), before there is a session.
verify_jwt = false

[functions.stock-master-sync]
# Settings → Estates → "Sync from Intranet" (Super Admin's session required).
verify_jwt = true
